<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--brand-green:#5DBB63;--brand-green-dark:#35843d}
*{box-sizing:border-box}
.msh a{color:#16233c;text-decoration:none}
.msh a:hover{color:#1c47a0}
.msh-navlink{position:relative;font:600 15px/1 Mulish,sans-serif;color:#2a3a56;padding:6px 0;white-space:nowrap;transition:color .15s}
.msh-navlink:hover{color:#1c47a0}
.msh-navlink[data-on="1"]{color:#1c47a0}
.msh-navlink[data-on="1"]::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#1c47a0;border-radius:2px}
.msh-burger{display:none}
@media(max-width:900px){
 .msh-nav{display:none !important}
 .msh-phone{display:none !important}
 .msh-burger{display:flex !important}
 .msh-bookbtn{display:none !important}
}
.msh-mobile{overflow:hidden;transition:max-height .28s ease}
.msh-langbtn{display:flex;align-items:center;gap:5px;background:#eef3f9;border:1px solid #dbe4ef;border-radius:8px;padding:6px 9px;cursor:pointer;font-family:Mulish,sans-serif;font-weight:700;font-size:12px;color:#122a52;transition:background .15s}
.msh-langbtn:hover{background:#e2ebf6}
.msh-langmenu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid #e2e9f1;border-radius:11px;box-shadow:0 14px 30px rgba(15,42,84,.14);padding:5px;min-width:120px;z-index:60}
.msh-langitem{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:Mulish,sans-serif;font-size:13px;font-weight:700;color:#2a3a56;transition:background .12s}
.msh-langitem:hover{background:#f2f6fd}
.msh-langcode{width:30px;height:22px;border-radius:4px;background:#122a52;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.3px}
.msh-flag{width:20px;height:14px;border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.14);flex:none;display:block}
@media(max-width:1100px){.msh-phone{display:none !important}.msh-bookbtn{display:none !important}}
@media(max-width:900px){.msh-lang-desktop{display:none !important}}
</style>
</helmet>
<div class="msh" style="width:100%;font-family:Mulish,sans-serif;position:relative;z-index:50">
<header style="max-width:1240px;margin:0 auto;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:11px;flex:none">
    <img src="logo-mark.png" alt="Magic Shine" style="height:38px;width:auto;display:block"/>
    <span style="font-family:'Playfair Display',serif;font-weight:600;font-size:23px;color:#122a52;letter-spacing:.2px">Magic Shine</span>
  </a>
  <nav class="msh-nav" style="display:flex;align-items:center;gap:30px">
    <a class="msh-navlink" data-nav="home" data-on="{{ homeOn }}" href="Home.dc.html">Home</a>
    <a class="msh-navlink" data-nav="about" data-on="{{ aboutOn }}" href="AboutUs.dc.html">About Us</a>
    <a class="msh-navlink" data-nav="services" data-on="{{ servicesOn }}" href="Services.dc.html" style="display:flex;align-items:center;gap:5px">Services<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></a>
    <a class="msh-navlink" data-nav="pricing" data-on="{{ pricingOn }}" href="Pricing.dc.html">Pricing</a>
    <a class="msh-navlink" data-nav="booking" data-on="{{ bookingOn }}" href="Booking.dc.html">Booking</a>
    <a class="msh-navlink" data-nav="contact" data-on="{{ contactOn }}" href="Contact.dc.html">Contact</a>
  </nav>
  <div style="display:flex;align-items:center;gap:18px;flex:none">
    <a class="msh-phone" href="tel:+11234567800" style="display:flex;align-items:center;gap:10px">
      <span style="width:38px;height:38px;border-radius:50%;background:#dbe7f7;display:flex;align-items:center;justify-content:center;flex:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1c47a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
      <span style="line-height:1.2"><span style="display:block;font-weight:700;font-size:15px;color:#122a52">(123) 456-7800</span><span style="display:block;font-size:12px;color:#6a7890">Call us anytime</span></span>
    </a>
    <a class="msh-bookbtn" href="Booking.dc.html" style="display:flex;align-items:center;gap:9px;background:#122a52;color:#fff;font-weight:700;font-size:14.5px;padding:14px 22px;border-radius:9px">Book Your Cleaning<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
    <div class="msh-lang-desktop" style="position:relative">
      <button class="msh-langbtn" onClick="{{ toggleLang }}" aria-label="Select language"><span class="msh-flag">{{ langFlag }}</span>{{ langShort }}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
      <div class="msh-langmenu">
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4"><button class="msh-langitem" onClick="{{ l.pick }}" style="background:{{ l.bg }}"><span class="msh-flag">{{ l.flag }}</span>{{ l.short }}<sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5DBB63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button></sc-for>
      </div>
      </sc-if>
    </div>
    <button class="msh-burger" onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px;height:44px;border:none;background:#122a52;border-radius:9px;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#fff">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
    </button>
  </div>
</header>
<div class="msh-mobile" style="max-height:{{ menuMax }};background:#fff">
  <div style="display:flex;flex-direction:column;padding:8px 40px 20px">
    <a href="Home.dc.html" style="padding:13px 0;border-bottom:1px solid #eef3f8;font-weight:600;color:#2a3a56">Home</a>
    <a href="AboutUs.dc.html" style="padding:13px 0;border-bottom:1px solid #eef3f8;font-weight:600;color:#2a3a56">About Us</a>
    <a href="Services.dc.html" style="padding:13px 0;border-bottom:1px solid #eef3f8;font-weight:600;color:#2a3a56">Services</a>
    <a href="Pricing.dc.html" style="padding:13px 0;border-bottom:1px solid #eef3f8;font-weight:600;color:#2a3a56">Pricing</a>
    <a href="Booking.dc.html" style="padding:13px 0;border-bottom:1px solid #eef3f8;font-weight:600;color:#2a3a56">Booking</a>
    <a href="Contact.dc.html" style="padding:13px 0;font-weight:600;color:#2a3a56">Contact</a>
    <div style="display:flex;gap:8px;margin-top:16px">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4"><button class="msh-langitem" onClick="{{ l.pick }}" style="flex:1;justify-content:center;border:1px solid {{ l.mb }};background:{{ l.bg }}"><span class="msh-flag">{{ l.flag }}</span></button></sc-for>
    </div>
    <a href="Booking.dc.html" style="margin-top:16px;text-align:center;background:#122a52;color:#fff;font-weight:700;padding:14px;border-radius:9px">Book Your Cleaning</a>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:92},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;pricing&quot;,&quot;booking&quot;,&quot;faq&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, langOpen: false, lang: 'en' };
  LANGS = [
    { code: 'EN', key: 'en', label: 'English', short: 'EN' },
    { code: 'SK', key: 'sk', label: 'Slovenčina', short: 'SK' },
    { code: 'SR', key: 'sr', label: 'Srpski', short: 'SR' },
    { code: 'AT', key: 'at', label: 'Österreichisch', short: 'AT' },
  ];
  componentDidMount() {
    try { const s = localStorage.getItem('ms-lang'); if (s) this.setState({ lang: s }); } catch (e) {}
  }
  pickLang(key) {
    this.setState({ lang: key, langOpen: false });
    try { localStorage.setItem('ms-lang', key); document.documentElement.lang = key; } catch (e) {}
  }
  flag(key) {
    const h = React.createElement;
    const svg = kids => h('svg', { viewBox: '0 0 60 40', width: '100%', height: '100%', preserveAspectRatio: 'none', style: { display: 'block' } }, kids.map((k, i) => h(k[0], { ...k[1], key: i })));
    const R = (x, y, w, hh, fill) => ['rect', { x, y, width: w, height: hh, fill }];
    const L = (x1, y1, x2, y2, stroke, sw) => ['line', { x1, y1, x2, y2, stroke, strokeWidth: sw }];
    if (key === 'sk') return svg([R(0,0,60,13.34,'#fff'), R(0,13.34,60,13.33,'#0b4ea2'), R(0,26.67,60,13.33,'#ee1c25'),
      ['path', { d: 'M13 9 H31 V21 Q31 28 22 33 Q13 28 13 21 Z', fill: '#ee1c25', stroke: '#fff', strokeWidth: 1.6 }],
      ['path', { d: 'M15 26.8 Q17.5 23.2 20 26.8 Q22 23.4 24.5 26.8 Q27 23.6 27 27 L27 30 L15 30 Z', fill: '#0b4ea2' }],
      ['rect', { x: 21, y: 11.5, width: 2, height: 14, fill: '#fff' }],
      ['rect', { x: 18.4, y: 14.4, width: 7.2, height: 1.8, fill: '#fff' }],
      ['rect', { x: 17.4, y: 18.4, width: 9.2, height: 1.8, fill: '#fff' }]]);
    if (key === 'sr') return svg([R(0,0,60,13.34,'#c6363c'), R(0,13.34,60,13.33,'#0c4076'), R(0,26.67,60,13.33,'#fff'),
      ['path', { d: 'M13 9 H31 V21 Q31 28 22 33 Q13 28 13 21 Z', fill: '#c6363c', stroke: '#fff', strokeWidth: 1.4 }],
      ['path', { d: 'M22 15 C20 13 17.5 12.6 16.4 13.8 C17.4 14.3 17.9 14.8 18.4 15.4 C15.6 16 14.4 17.6 15.2 19.4 C16.7 18.6 18 18.6 19.4 18.9 L18.3 23 L21 21.8 L22 24 L23 21.8 L25.7 23 L24.6 18.9 C26 18.6 27.3 18.6 28.8 19.4 C29.6 17.6 28.4 16 25.6 15.4 C26.1 14.8 26.6 14.3 27.6 13.8 C26.5 12.6 24 13 22 15 Z', fill: '#e6b93b' }],
      ['rect', { x: 20.6, y: 17, width: 2.8, height: 3.4, fill: '#c6363c', stroke: '#fff', strokeWidth: 0.5 }],
      ['path', { d: 'M22 17.2 V20.2 M20.9 18.7 H23.1', stroke: '#fff', strokeWidth: 0.5 }]]);
    if (key === 'at') return svg([R(0,0,60,13.34,'#ef3340'), R(0,13.34,60,13.33,'#fff'), R(0,26.67,60,13.33,'#ef3340')]);
    return svg([R(0,0,60,40,'#012169'), L(0,0,60,40,'#fff',8), L(60,0,0,40,'#fff',8), L(0,0,60,40,'#c8102e',3), L(60,0,0,40,'#c8102e',3), R(25,0,10,40,'#fff'), R(0,15,60,10,'#fff'), R(27,0,6,40,'#c8102e'), R(0,17,60,6,'#c8102e')]);
  }
  renderVals() {
    const a = this.props.active || 'home';
    const on = k => (a === k ? '1' : '0');
    const cur = this.LANGS.find(l => l.key === this.state.lang) || this.LANGS[0];
    return {
      menuMax: this.state.open ? '560px' : '0px',
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      langOpen: this.state.langOpen,
      toggleLang: () => this.setState(s => ({ langOpen: !s.langOpen })),
      langCode: cur.code,
      langShort: cur.short,
      langFlag: this.flag(cur.key),
      langs: this.LANGS.map(l => ({
        code: l.code, label: l.label, short: l.short, active: l.key === this.state.lang, flag: this.flag(l.key),
        bg: l.key === this.state.lang ? '#f2f6fd' : 'transparent',
        mb: l.key === this.state.lang ? '#1c47a0' : '#dbe4ef',
        pick: () => this.pickLang(l.key),
      })),
      homeOn: on('home'), aboutOn: on('about'), servicesOn: on('services'),
      pricingOn: on('pricing'), bookingOn: on('booking'), faqOn: on('faq'), contactOn: on('contact'),
    };
  }
}
</script>
</body>
</html>
